[env:telloesp32]

platform = espressif32
board = telloesp32
framework = arduino

upload_port = COM8
monitor_port = COM8

upload_speed = 115200
monitor_speed = 115200

board_build.f_cpu = 160000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio

board_build.partitions = minimal.csv
lib_deps = pololu/VL53L0X